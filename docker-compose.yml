services:
  web:
    image: nginx
    container_name: portfolio_web
    ports:
      - "8088:80"
    volumes:
      - .:/usr/share/nginx/html
    logging:
      driver: json-file

  mysql:
    image: mysql:8
    container_name: portfolio_mysql
    environment:
      MYSQL_ROOT_PASSWORD: Duy@123456
      MYSQL_DATABASE: portfolio
    ports:
      - "3307:3306"
    logging:
      driver: json-file

  phpmyadmin:
    image: phpmyadmin
    container_name: portfolio_pma
    environment:
      PMA_HOST: mysql
    ports:
      - "8080:80"
    logging:
      driver: json-file

  grafana:
    image: grafana/grafana
    container_name: portfolio_grafana
    ports:
      - "3001:3000"
    logging:
      driver: json-file

  loki:
    image: grafana/loki:latest
    container_name: portfolio_loki
    ports:
      - "3100:3100"
    logging:
      driver: json-file

  promtail:
    image: grafana/promtail:latest
    container_name: portfolio_promtail
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    logging:
      driver: json-file